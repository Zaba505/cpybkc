name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # A release is a tag push and nothing else. The tag is here so the pipeline
    # runs on one at all; this workflow publishes nothing under any of them, and
    # never will. What a release publishes is release.yaml's, fired by a
    # published release rather than by a pushed tag, and which tags it publishes
    # under is the module's decision from the refs at HEAD (#59) — not this list
    # and not an `if:` on a job.
    #
    # Two patterns because this repository publishes two modules. The CLI's
    # releases are vX.Y.Z; the IR module's are irpb/vX.Y.Z, which is not a prefix
    # anybody chose — it is Go's own rule for tagging a module in a subdirectory,
    # and it is what makes the IR module's version independent of the CLI's. A
    # list matching only "v*" would run the pipeline on one repository's releases
    # and silently skip the other's.
    tags:
      - "v*"
      - "irpb/v*"

# A pull request only needs an answer about its newest commit. Superseded runs
# are cancelled so the queue reflects what is actually up for review. Pushes to
# main keep their runs — main's history is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The floor for every job. A job that needs more says so itself, so that reading
# one job tells you what that job can reach.
permissions:
  contents: read

jobs:
  # The whole pipeline: fmt, vet, golangci-lint, `go test -race` and `buf lint`,
  # as the root Dagger module defines them and as `dagger call ci` runs them on a
  # contributor's machine. It is one call and it stays one — a step here that
  # reran any of those stages would be a second definition of the standard, and
  # the two would drift. See CONTRIBUTING.md and .dagger/main.go.
  #
  # Repo-specific verification lands as another function on the root module,
  # never as raw Go steps beside this one. `buf lint` over the IR schema is the
  # first of them and it is called by `ci` rather than by a second `dagger call`
  # here, so that the gate a contributor runs before pushing is the whole of what
  # CI checks. A golden-file or corpus job written with `actions/setup-go` and
  # `go test` would be a second toolchain, a second set of stage definitions and
  # a second answer to what this repository checks.
  #
  # The conformance corpus (#66-#68) needed neither: it is Go tests under
  # testdata/, so `go test` inside the standard pipeline already runs it, and a
  # stage of its own would have been that same second definition arrived at from
  # the other direction. That is also what makes it a gate on every platform in
  # the matrix — the matrix is a matrix of this one call, so a platform added
  # below carries the corpus with it rather than needing a job added beside it.
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      # Reading the source is all the pipeline does. It builds the two IR
      # artifacts a release attaches (#19) and the published base image on every
      # platform it ships for (#55), but it builds them inside the engine and
      # throws them away — nothing here uploads, pushes or signs anything. So no
      # `contents: write`, which belongs to release.yaml's job because that is
      # where an asset is attached; no `packages: write`, because nothing is
      # pushed; and no `id-token: write`, because the signature and the
      # attestations are produced by the shared pipeline at release time and this
      # job never asks for a workload identity token. Each grant belongs to the
      # change that gives it a use, next to the step that needs it, rather than
      # being held here in advance against a job that would not notice it
      # missing.
      contents: read
    steps:
      # Unshallow, with tags, because `ci` builds an image (#185). The module
      # still excludes .git from the *source* directory the check stages read —
      # none of fmt, vet, lint or test looks at git metadata, and folding it in
      # would make every commit a cache miss for all four — but it binds .git as
      # its own input, and the archetype refuses to build an App without one. Ci
      # runs ImageContract, so this job is one of the ones that builds.
      #
      # `fetch-depth: 0` rather than a shallow clone with `fetch-tags`, because
      # what the archetype reads is HEAD's own commit object — its SHA, its
      # committer time — and a repository whose objects are a graft point is one
      # `git log -1` can still answer from but which nothing else about a build
      # should have to reason about.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to the engineVersion the module itself declares, read out of
      # dagger.json rather than repeated here. The CLI provisions an engine of
      # its own version, so a number typed into this file could drift from the
      # module's and leave CI running the pipeline on an engine the module has
      # never been run against — which is the difference between this repository
      # and every other one that the module exists to prevent. It is the same
      # command CONTRIBUTING.md gives contributors, for the same reason.
      # set -euo pipefail because a `run:` block is `bash -e` without it: a
      # failed download would otherwise leave `sh` reading empty input and
      # exiting 0, and the step would pass with no Dagger installed.
      - name: Install the Dagger CLI
        run: |
          set -euo pipefail
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$(jq -r .engineVersion dagger.json | tr -d v)" \
              BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # No arguments, because the module's source defaults to the repository
      # root and its lint configuration defaults to the .golangci.yml committed
      # beside it. This is character-for-character what a contributor runs
      # before pushing, so there is no arrangement of local commands that passes
      # while CI fails.
      - name: Run the pipeline
        run: dagger call ci
