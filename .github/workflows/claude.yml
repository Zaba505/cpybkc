name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # A reviewer that cannot build the code reviews by reading it, and this
      # repository's verify command is `dagger call ci` rather than anything a
      # bare runner already has. Both toolchains are installed the same way CI
      # installs them, so what Claude can run here is what a contributor runs.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Pinned to the engineVersion the module declares, read out of dagger.json
      # rather than repeated here — the same reasoning as ci.yaml.
      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$(jq -r .engineVersion dagger.json | tr -d v)" \
              BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # The tools the two steps above exist to make useful. `go test` is
          # scoped by `-C` rather than a `cd`, because this repository is three
          # modules and `./...` from the root reaches only one of them.
          claude_args: >-
            --allowed-tools
            "Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(go list:*),Bash(go doc:*),Bash(dagger call:*),Bash(gh pr:*)"

