# The lint policy for this repository, and the one CI enforces.
#
# It is not consulted by a `golangci-lint` you happen to have on PATH — it is
# passed explicitly to the Z5Labs standard pipeline by .dagger/main.go, so that
# the configuration committed here is the configuration the lint stage runs
# against. A .golangci.yml that CI ignored would be a file contributors read and
# trusted while the pipeline enforced something else. The same file is passed to
# all four invocations, so this repository's four Go modules are linted against
# one configuration rather than one each.
#
# Written in the golangci-lint **v2** dialect, because that is the major the
# standard pipeline runs. The majors are not interchangeable: a v2 binary refuses
# a v1 file outright, before any linter runs, and v1 refuses a v2 one. The
# `version: "2"` below is the config schema's version, required by v2 and absent
# from v1; it is not the tool pin. The tool pin lives in
# github.com/z5labs/devex/daggerverse/go, which is where a bump belongs, and
# nothing here restates it.
#
# The enabled set is v2's own "standard" set plus `modernize`, spelled out rather
# than inherited so that a change to golangci-lint's defaults is a change this
# repository has to make deliberately — and so that the one addition to the
# standard set is visible as an addition rather than lost in an inherited list.
#
# Unlike cobol-go, `unused` is left enabled: this repository starts from an
# empty package tree rather than a pre-seeded set of building-block helpers,
# so there is nothing legitimately unused to exempt.
#
# `modernize` is enforced because the alternative is not "no rule" but "a rule
# only some readers see": a gopls-backed editor raises its suggestions whether
# this file enables it or not, so leaving it out made every one of them noise to
# whoever had the file open and a finding nothing ever cleared. Enforcing it
# makes each suggestion a decision — taken, or declined at the site with a
# `//nolint:modernize` saying why. Declining belongs in the file and not here:
# an exclusion rule in this config would silence an analyzer across the whole
# repository, which is the repository-wide silence this paragraph exists to
# prevent.
#
# It has a cost worth stating rather than discovering. `modernize`'s suggestions
# track the Go release and the golangci-lint pin, so a version bump can turn CI
# red on code nobody touched. Renovate raises those bumps automatically (#245),
# so the first such pull request is where this shows up, and the fix there is to
# clear or decline the new findings in the same pull request.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - modernize
    - staticcheck
    - unused

issues:
  # Generated files are linted like every other file, which is not
  # golangci-lint's default: v2 excludes a file carrying a `// Code generated …
  # DO NOT EDIT.` header from every linter unless this says otherwise.
  #
  # The default is right for a repository whose generated code is somebody
  # else's output. It is wrong here, because generated Go is this repository's
  # *product*: the packages under cmd/cpybkc-gen-go/internal and example/ledger
  # are checked in as packages rather than as fixtures precisely so that the
  # compiler and the linter reach them, and a rule the linter skipped there is a
  # rule an adopter's tree would break on with nothing here to have said so.
  # cpybkc-gen-go writes tests now (#264), and `errcheck`, `govet`,
  # `staticcheck`, `unused` and `modernize` reaching a generated `_test.go` is
  # the whole of what makes "the generated tests are clean under this file" a
  # statement rather than a hope.
  exclude-generated: disable
